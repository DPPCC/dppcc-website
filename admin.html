<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Official DPPCC cricket club website"><title>Admin Dashboard | DPPCC</title><link rel="stylesheet" href="css/style.css"></head><body data-role="Admin"><header><div class="nav"><a class="brand" href="index.html"><img src="assets/dppcc-club-logo.jpg" alt="DPPCC Club Logo"><span>DUNGSREE PASCHIM PARA<small>CRICKET CLUB · DPPCC</small></span></a><nav aria-label="Main navigation"><a href="index.html">HOME</a><a href="about.html">ABOUT</a><a href="players.html">PLAYERS</a><a href="register.html">REGISTER</a><a href="jersey.html">JERSEY</a><a href="matches.html">MATCHES</a><a href="news.html">NEWS</a><a href="sponsor.html">SPONSOR</a><a href="login.html">ADMIN</a></nav></div></header><main class="dashboard"><div class="card"><h1 id="dashWelcome">Admin Dashboard</h1><p id="dashEmail"></p><button id="logoutButton" class="danger">LOG OUT</button><div class="tabs"><a href="index.html">Public Website</a></div></div><section class="card" data-permission="players"><h2>Players</h2><form id="dashPlayerForm"><input type="hidden" name="docId"><label>Player Name</label><input name="name" maxlength="70" required><label>Role</label><select name="role"><option>Batsman</option><option>Bowler</option><option>All-Rounder</option><option>Wicket Keeper</option></select><label>Jersey Number</label><input name="jerseyNo" type="number" min="0" max="999" required><label>Photo URL (optional HTTPS)</label><input name="photoUrl" type="url" placeholder="https://..."><button>ADD PLAYER</button></form><div id="dashPlayers"></div></section><section class="card" data-permission="matches"><h2>Matches</h2><form id="dashMatchForm"><input type="hidden" name="docId"><label>Opponent</label><input name="opponent" maxlength="70" required><label>Date</label><input name="date" type="date" required><label>Venue</label><input name="venue" maxlength="100"><label>Status</label><select name="status"><option>Upcoming</option><option>Live</option><option>Completed</option></select><label>Result</label><input name="result" maxlength="150"><button>SAVE MATCH</button></form><div id="dashMatches"></div></section><section class="card" data-permission="live"><h2>Live Score Update</h2><form id="dashBallForm"><label>Match label</label><input name="matchLabel" required><label>Over</label><input name="over" type="number" min="0" required><label>Ball</label><input name="ball" type="number" min="1" max="6" required><label>Runs</label><input name="runs" type="number" min="0" max="6" required><label>Wicket?</label><select name="wicket"><option value="false">No</option><option value="true">Yes</option></select><label>Commentary</label><input name="commentary" maxlength="180"><button>PUBLISH BALL</button></form><div id="dashLiveScores"></div></section><section class="card" data-permission="news"><h2>Publish News</h2><form id="dashNewsForm"><input type="hidden" name="docId"><label>Title</label><input name="title" maxlength="100" required><label>Announcement</label><textarea name="body" maxlength="1000" required></textarea><button>PUBLISH NEWS</button></form><div id="dashNews"></div></section><section class="card" data-permission="submissions"><h2>Player Registrations</h2><div id="dashRegs"></div><h2>Jersey Orders</h2><div id="dashOrders"></div></section></main><div data-footer></div><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script><script src="js/app.js"></script></body></html>
