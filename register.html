<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Official DPPCC cricket club website"><title>Player Registration | DPPCC</title><link rel="stylesheet" href="css/style.css"></head><body><div data-nav></div><main class="wrap"><div class="heading"><small>BE PART OF DPPCC</small><h1>PLAYER REGISTRATION</h1><p>Register your interest in joining the club.</p></div><div class="formbox"><h3>Player Registration Form</h3><form id="registrationForm"><label>Full Name</label><input name="name" maxlength="70" required><label>Phone Number</label><input name="phone" maxlength="20" required><label>Age</label><input name="age" type="number" min="8" max="70" required><label>Playing Role</label><select name="role" required><option value="">Select role</option><option>Batsman</option><option>Bowler</option><option>All-Rounder</option><option>Wicket Keeper</option></select><label>Address</label><textarea name="address" maxlength="120" required></textarea><button>SUBMIT REGISTRATION</button><div id="registrationFormMessage" class="status hidden"></div></form></div></main><div data-footer></div><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script><script src="js/app.js"></script></body></html>
