<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DPPCC Owner Panel</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body data-role="Owner">

  <header>
    <div class="nav">
      <a class="brand" href="index.html">
        <img src="assets/dppcc-club-logo.jpg" alt="DPPCC">
        <span>
          DPPCC
          <small>OWNER PANEL</small>
        </span>
      </a>

      <nav>
        <a href="index.html">PUBLIC WEBSITE</a>
        <button id="logoutButton" class="danger">LOG OUT</button>
      </nav>
    </div>
  </header>

  <main class="wrap">

    <div class="heading">
      <small>AUTHORIZED DASHBOARD</small>
      <h2>OWNER CONTROL PANEL</h2>
      <p>Full club administration and staff access control.</p>
    </div>

    <div id="accessMessage" class="status">
      Checking your access...
    </div>

    <div id="dashboardContent" class="hidden">

      <div class="notice" id="welcomeText"></div>

      <div class="dashboard-grid" id="formsArea"></div>

      <section class="formbox">
        <h3>Club Data</h3>

        <div class="stats">
          <div class="stat">
            <b id="statPlayers">—</b>
            <span>Players</span>
          </div>

          <div class="stat">
            <b id="statMatches">—</b>
            <span>Matches</span>
          </div>

          <div class="stat">
            <b id="statNews">—</b>
            <span>News Posts</span>
          </div>
        </div>
      </section>

      <div id="recordsArea"></div>

    </div>
  </main>

  <!-- Firebase Compat SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

  <!-- DPPCC Firebase Compat Configuration -->
  <script src="js/firebase-config-compat.js"></script>

  <!-- Dashboard JavaScript -->
  <script src="js/dashboard.js"></script>

</body>
</html>
