<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Official DPPCC cricket club website"><title>Captain Dashboard | DPPCC</title><link rel="stylesheet" href="css/style.css"></head><body><div data-nav></div><main class="dashboard" data-role="Captain"><div class="card"><h1 id="dashWelcome">Captain Dashboard</h1><p id="dashEmail"></p><button id="logoutButton" class="danger">LOG OUT</button><div class="tabs"><a href="index.html">Public Website</a></div></div><section class="card" data-permission="players"><h2>Players</h2><form id="dashPlayerForm"><label>Player Name</label><input name="name" required><label>Role</label><select name="role"><option>Batsman</option><option>Bowler</option><option>All-Rounder</option><option>Wicket Keeper</option></select><label>Jersey Number</label><input name="jerseyNo" type="number" min="0" max="999" required><label>Photo URL (optional HTTPS)</label><input name="photoUrl" type="url"><button>ADD PLAYER</button></form><div id="dashPlayers"></div></section><section class="card" data-permission="matches"><h2>Matches</h2><form id="dashMatchForm"><label>Opponent</label><input name="opponent" required><label>Date</label><input name="date" type="date" required><label>Venue</label><input name="venue"><label>Status</label><select name="status"><option>Upcoming</option><option>Live</option><option>Completed</option></select><label>Result</label><input name="result"><button>SAVE MATCH</button></form><div id="dashMatches"></div></section><section class="card" data-permission="live"><h2>Live Score Update</h2><form id="dashBallForm"><label>Match label</label><input name="matchLabel" required><label>Over</label><input name="over" type="number" min="0" required><label>Ball</label><input name="ball" type="number" min="1" max="6" required><label>Runs</label><input name="runs" type="number" min="0" max="6" required><label>Wicket?</label><select name="wicket"><option value="false">No</option><option value="true">Yes</option></select><label>Commentary</label><input name="commentary"><button>PUBLISH BALL</button></form></section></main><div data-footer></div><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script><script src="js/app.js"></script></body></html>
